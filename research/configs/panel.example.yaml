# Default five-judge cross-family panel (see RESEARCH_PLAN.md §2, panel selection).
#
# All judges route through OpenRouter: one key, one bill, unified cost
# accounting. Reproducibility (plan §7) is preserved by pinning: every model
# slug is exact-versioned (never ~latest aliases), and every open-weight
# judge pins its upstream provider and precision with allow_fallbacks: false
# so the same slug is never silently served by a different host or
# quantization between runs. GPT and Claude are served first-party by
# OpenAI/Anthropic, so only the routing pin is needed there.
#
# Keys are read from environment variables; nothing secret lives in this file.
metric: kendall
cache: .tal/cache.sqlite
judges:
  - name: gpt-4o
    model: openai/gpt-4o-2024-08-06
    provider: openrouter
    extra_body:
      provider:
        order: [openai]
        allow_fallbacks: false
  - name: claude-sonnet
    model: anthropic/claude-sonnet-4.5
    provider: openrouter
    extra_body:
      provider:
        order: [anthropic]
        allow_fallbacks: false
  - name: qwen-72b
    model: qwen/qwen-2.5-72b-instruct
    provider: openrouter
    extra_body:
      provider:
        order: [together]
        allow_fallbacks: false
        quantizations: [fp16]
  - name: llama-70b
    model: meta-llama/llama-3.3-70b-instruct
    provider: openrouter
    extra_body:
      provider:
        order: [together]
        allow_fallbacks: false
        quantizations: [fp16]
  - name: mistral-large
    model: mistralai/mistral-large-2411
    provider: openrouter
    extra_body:
      provider:
        order: [mistral]
        allow_fallbacks: false
